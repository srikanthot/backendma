# Move this file to .github/workflows/eval.yml (GitHub Actions can't be written by remote tools).
name: rag-eval
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run RAG evaluation gate
        run: python -m eval.run --dataset eval/golden.jsonl
